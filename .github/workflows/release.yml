name: production-release-controller

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact future or existing production tag
        required: true
        type: string
      source_sha:
        description: Exact private main source commit
        required: true
        type: string
      mode:
        description: Build preflight, immutable release, or manual RuStore publication
        required: true
        type: choice
        options:
          - build-only
          - publish
          - rustore-publish
      confirmation:
        description: 'RuStore only: PUBLISH ru.altparking.guard <tag> <versionId>'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-release-controller-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.mode == 'build-only' || inputs.mode == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out public release controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: controller

      - name: Mask private source identity
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPOSITORY"
          printf '::add-mask::%s\n' "$SOURCE_REPOSITORY"

      - name: Check out exact private source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          token: ${{ secrets.SOURCE_REPO_READ_TOKEN }}
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Validate private source provenance and CI
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_REPO_READ_TOKEN: ${{ secrets.SOURCE_REPO_READ_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40,64}$ ]]
          case "$RELEASE_MODE" in
            build-only|publish)
              ;;
            *)
              printf 'Unsupported release mode.\n' >&2
              exit 1
              ;;
          esac

          actual_sha="$(git -C source rev-parse HEAD)"
          test "$actual_sha" = "$SOURCE_SHA"
          git -C source fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          git -C source merge-base --is-ancestor "$SOURCE_SHA" \
            refs/remotes/origin/main

          tag_ref="refs/tags/${RELEASE_TAG}"
          tag_query="${RUNNER_TEMP}/private-release-tag.txt"
          set +e
          git -C source ls-remote --exit-code --tags --refs \
            origin "$tag_ref" > "$tag_query" 2>/dev/null
          tag_status=$?
          set -e
          case "$tag_status" in
            0)
              git -C source fetch --force --no-tags \
                origin "${tag_ref}:${tag_ref}"
              tag_commit="$(
                git -C source rev-parse "refs/tags/${RELEASE_TAG}^{commit}"
              )"
              test "$tag_commit" = "$SOURCE_SHA" || {
                printf 'The private release tag points to another commit.\n' >&2
                exit 1
              }
              ;;
            2)
              case "$RELEASE_MODE" in
                build-only)
                  ;;
                publish)
                  printf 'Publish mode requires an existing private tag.\n' >&2
                  exit 1
                  ;;
              esac
              ;;
            *)
              printf 'Private release tag lookup failed.\n' >&2
              exit 1
              ;;
          esac

          git -C source config --local --unset-all \
            http.https://github.com/.extraheader || true
          cmp controller/.github/workflows/release.yml \
            source/distribution/github/workflows/release.yml
          cmp controller/tool/rustore_api.py source/tool/rustore_api.py
          cmp controller/tool/rustore_release.py source/tool/rustore_release.py
          cmp controller/tool/rustore_api_test.py source/tool/rustore_api_test.py
          cmp controller/tool/rustore_release_test.py source/tool/rustore_release_test.py

          ci_response="${RUNNER_TEMP}/private-mobile-ci-runs.json"
          ci_status="$(
            curl --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${SOURCE_REPO_READ_TOKEN}" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              --output "$ci_response" \
              --write-out '%{http_code}' \
              "https://api.github.com/repos/${SOURCE_REPOSITORY}/actions/workflows/ci.yml/runs?event=push&head_sha=${SOURCE_SHA}&per_page=100"
          )"
          test "$ci_status" = "200" || {
            printf 'Private mobile CI lookup failed.\n' >&2
            exit 1
          }
          python - "$ci_response" "$SOURCE_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path

          response_path = Path(sys.argv[1])
          source_sha = sys.argv[2]
          try:
              payload = json.loads(response_path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as error:
              raise SystemExit("private mobile CI response is invalid") from error
          if not isinstance(payload, dict):
              raise SystemExit("private mobile CI response must be an object")
          runs = payload.get("workflow_runs")
          if not isinstance(runs, list):
              raise SystemExit("private mobile CI runs must be an array")
          for run in runs:
              if not isinstance(run, dict):
                  raise SystemExit("private mobile CI run must be an object")
              required_fields = ("name", "head_sha", "event", "status", "conclusion")
              if any(field not in run for field in required_fields):
                  raise SystemExit("private mobile CI run is missing required fields")
          matching = [
              run
              for run in runs
              if run["name"] == "mobile-ci"
              and run["head_sha"] == source_sha
              and run["event"] == "push"
              and run["status"] == "completed"
              and run["conclusion"] == "success"
          ]
          if not matching:
              raise SystemExit(
                  "source SHA has no successful completed mobile-ci push run"
              )
          PY

      - name: Test reviewed RuStore helpers
        working-directory: controller
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tool.rustore_api_test tool.rustore_release_test -v

      - name: Validate RuStore delivery configuration
        shell: bash
        env:
          RUSTORE_DELIVERY_ENABLED: ${{ vars.RUSTORE_DELIVERY_ENABLED }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os

          if os.environ.get("RUSTORE_DELIVERY_ENABLED") not in ("true", "false"):
              raise SystemExit("RUSTORE_DELIVERY_ENABLED must be exactly true or false")
          PY

      - name: Prepare temporary Firebase Android config
        shell: bash
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_ANDROID_CONFIG_BASE64"
          config_path="source/android/app/google-services.json"
          printf '%s' "$FIREBASE_ANDROID_CONFIG_BASE64" |
            base64 --decode > "$config_path"
          chmod 600 "$config_path"
          python - "$config_path" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          try:
              payload = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as error:
              raise SystemExit("Firebase Android config is invalid") from error
          if not isinstance(payload, dict):
              raise SystemExit("Firebase Android config must be an object")
          project = payload.get("project_info")
          clients = payload.get("client")
          if not isinstance(project, dict):
              raise SystemExit("Firebase project_info must be an object")
          project_id = project.get("project_id")
          if (
              not isinstance(project_id, str)
              or project_id != "alt-parking-guard-production"
          ):
              raise SystemExit(
                  "Firebase project_id must be alt-parking-guard-production"
              )
          if not isinstance(clients, list):
              raise SystemExit("Firebase clients are missing")
          package_names = set()
          for client in clients:
              if not isinstance(client, dict):
                  raise SystemExit("Firebase client entry must be an object")
              client_info = client.get("client_info")
              if not isinstance(client_info, dict):
                  raise SystemExit("Firebase client_info must be an object")
              android_client_info = client_info.get("android_client_info")
              if not isinstance(android_client_info, dict):
                  raise SystemExit(
                      "Firebase android_client_info must be an object"
                  )
              package_names.add(android_client_info.get("package_name"))
          if "ru.altparking.guard" not in package_names:
              raise SystemExit("Firebase config does not contain ru.altparking.guard")
          PY

      - name: Read latest public release metadata
        id: previous-release
        shell: bash
        run: |
          set -euo pipefail
          latest_release_path="${RUNNER_TEMP}/latest-public-release.json"
          manifest_path="${RUNNER_TEMP}/previous-release-manifest.json"
          release_status="$(
            curl --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              --output "$latest_release_path" \
              --write-out '%{http_code}' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest"
          )"
          case "$release_status" in
            404)
              rm -f "$latest_release_path" "$manifest_path"
              printf 'arguments=\n' >> "$GITHUB_OUTPUT"
              ;;
            200)
              manifest_url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/release-manifest.json"
              manifest_status="$(
                curl --silent --show-error --location \
                  --output "$manifest_path" \
                  --write-out '%{http_code}' \
                  "$manifest_url"
              )"
              test "$manifest_status" = "200" || {
                printf 'Latest public release metadata is unavailable.\n' >&2
                exit 1
              }
              printf 'arguments=--previous-manifest %q\n' \
                "$manifest_path" >> "$GITHUB_OUTPUT"
              ;;
            *)
              printf 'Latest public release lookup failed.\n' >&2
              exit 1
              ;;
          esac

      - name: Validate version metadata
        id: metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          previous_arguments="${{ steps.previous-release.outputs.arguments }}"
          # shellcheck disable=SC2086
          python source/tool/release_metadata.py validate \
            --tag "$RELEASE_TAG" \
            --pubspec source/pubspec.yaml \
            $previous_arguments \
            --github-output "$GITHUB_OUTPUT"

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Install private source dependencies
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Prepare temporary production signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          for required_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD \
            ANDROID_STORE_PASSWORD
          do
            test -n "${!required_name}" || {
              printf 'Missing required signing input: %s\n' "$required_name" >&2
              exit 1
            }
          done
          keystore_path="${RUNNER_TEMP}/guard-production.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" |
            base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          KEYSTORE_PATH="$keystore_path" \
            python controller/tool/java_properties.py android-signing \
              --output source/android/key.properties
          chmod 600 source/android/key.properties

      - name: Build production Android artifacts
        working-directory: source
        shell: bash
        env:
          PROD_API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
          PROD_WS_BASE_URL: ${{ vars.PROD_WS_BASE_URL }}
          SUPPORT_PHONE: ${{ vars.SUPPORT_PHONE }}
          RUSTORE_PUSH_PROJECT_ID: ${{ vars.RUSTORE_PUSH_PROJECT_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from urllib.parse import urlsplit

          def require_url(name: str):
              value = os.environ.get(name, "")
              if not value or any(character.isspace() for character in value):
                  raise SystemExit(f"{name} is missing or contains whitespace")
              try:
                  parsed = urlsplit(value)
                  parsed.port
                  return parsed
              except ValueError as error:
                  raise SystemExit(f"{name} is invalid: {error}") from error

          api = require_url("PROD_API_BASE_URL")
          if (
              api.scheme != "https"
              or not api.hostname
              or api.username is not None
              or api.password is not None
              or not api.path.endswith("/api/v1")
              or api.query
              or api.fragment
          ):
              raise SystemExit(
                  "PROD_API_BASE_URL must be credential-free HTTPS, end in "
                  "/api/v1, and contain no query or fragment"
              )

          websocket = require_url("PROD_WS_BASE_URL")
          if (
              websocket.scheme != "wss"
              or not websocket.hostname
              or websocket.username is not None
              or websocket.password is not None
              or websocket.path
              or websocket.query
              or websocket.fragment
          ):
              raise SystemExit(
                  "PROD_WS_BASE_URL must be a credential-free WSS origin"
              )

          support_phone = os.environ.get("SUPPORT_PHONE", "")
          support_phone_pattern = re.compile(r"^\+?[0-9 ()-]{5,32}$")
          if not support_phone_pattern.fullmatch(support_phone):
              raise SystemExit("SUPPORT_PHONE is invalid")

          rustore_project_id = os.environ.get("RUSTORE_PUSH_PROJECT_ID", "")
          rustore_project_id_pattern = re.compile(r"^[A-Za-z0-9_-]{1,128}$")
          if not rustore_project_id_pattern.fullmatch(rustore_project_id):
              raise SystemExit("RUSTORE_PUSH_PROJECT_ID is invalid")
          PY
          flutter build apk --release --flavor prod \
            --dart-define=APP_ENV=prod \
            --dart-define=API_BASE_URL="$PROD_API_BASE_URL" \
            --dart-define=WS_BASE_URL="$PROD_WS_BASE_URL" \
            --dart-define=SUPPORT_PHONE="$SUPPORT_PHONE"
          flutter build appbundle --release --flavor prod \
            --dart-define=APP_ENV=prod \
            --dart-define=API_BASE_URL="$PROD_API_BASE_URL" \
            --dart-define=WS_BASE_URL="$PROD_WS_BASE_URL" \
            --dart-define=SUPPORT_PHONE="$SUPPORT_PHONE"

      - name: Verify and package production artifacts
        id: verified
        shell: bash
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          EXPECTED_VERSION_CODE: ${{ steps.metadata.outputs.build_number }}
        run: |
          set -euo pipefail
          build_tools="$(
            find "${ANDROID_HOME}/build-tools" \
              -mindepth 1 -maxdepth 1 -type d -print |
              sort -V |
              tail -n 1
          )"
          test -n "$build_tools"
          apksigner="${build_tools}/apksigner"
          zipalign="${build_tools}/zipalign"
          aapt="${build_tools}/aapt"
          apkanalyzer="$(
            find "${ANDROID_HOME}/cmdline-tools" \
              -type f -name apkanalyzer -print |
              sort -V |
              tail -n 1
          )"
          test -x "$apkanalyzer"
          apk_path="source/build/app/outputs/flutter-apk/app-prod-release.apk"
          aab_path="source/build/app/outputs/bundle/prodRelease/app-prod-release.aab"
          test -f "$apk_path"
          test -f "$aab_path"
          jarsigner -verify -strict \
            -keystore "${RUNNER_TEMP}/guard-production.jks" \
            -storepass:env ANDROID_STORE_PASSWORD \
            "$aab_path"

          package_id="$(
            "$aapt" dump badging "$apk_path" |
              sed -n "s/^package: name='\([^']*\)'.*/\1/p"
          )"
          test "$package_id" = "ru.altparking.guard"
          version_name="$("$apkanalyzer" manifest version-name "$apk_path")"
          version_code="$("$apkanalyzer" manifest version-code "$apk_path")"
          test "$version_name" = "$EXPECTED_VERSION_NAME"
          test "$version_code" = "$EXPECTED_VERSION_CODE"
          work_database_code="${RUNNER_TEMP}/work-database-code.txt"
          "$apkanalyzer" dex code \
            --class androidx.work.impl.WorkDatabase_Impl "$apk_path" > \
            "$work_database_code"
          grep -Fq '.method public constructor <init>()V' \
            "$work_database_code"
          "$apksigner" verify --verbose "$apk_path"
          actual_certificate_pem_path="${RUNNER_TEMP}/apk-signer-certificate.pem"
          "$apksigner" verify --print-certs-pem "$apk_path" > \
            "$actual_certificate_pem_path"
          actual_certificate="$(
            python - "$actual_certificate_pem_path" <<'PY'
          import base64
          import hashlib
          import re
          import sys
          from pathlib import Path

          pem_text = Path(sys.argv[1]).read_text(encoding="ascii")
          matches = re.findall(
              r"-----BEGIN CERTIFICATE-----\s*(.*?)\s*-----END CERTIFICATE-----",
              pem_text,
              flags=re.DOTALL,
          )
          if len(matches) != 1:
              raise SystemExit("APK must expose exactly one signing certificate")
          certificate = base64.b64decode(
              re.sub(r"\s+", "", matches[0]),
              validate=True,
          )
          print(hashlib.sha256(certificate).hexdigest())
          PY
          )"
          expected_certificate_path="${RUNNER_TEMP}/expected-production-cert.der"
          keytool -exportcert \
            -alias "$ANDROID_KEY_ALIAS" \
            -keystore "${RUNNER_TEMP}/guard-production.jks" \
            -storepass:env ANDROID_STORE_PASSWORD \
            -file "$expected_certificate_path" >/dev/null
          expected_certificate="$(
            sha256sum "$expected_certificate_path" |
              awk '{print $1}'
          )"
          normalize_certificate_fingerprint() {
            printf '%s' "$1" |
              tr '[:upper:]' '[:lower:]' |
              tr -d '[:space:]'
          }
          actual_certificate="$(
            normalize_certificate_fingerprint "$actual_certificate"
          )"
          expected_certificate="$(
            normalize_certificate_fingerprint "$expected_certificate"
          )"
          python - "$actual_certificate" "$expected_certificate" <<'PY'
          import re
          import sys

          actual, expected = sys.argv[1:]
          for label, fingerprint in (
              ("APK signer", actual),
              ("Keystore alias", expected),
          ):
              if not re.fullmatch(r"[0-9a-f]{64}", fingerprint):
                  raise SystemExit(
                      f"{label} fingerprint is not a 64-character lowercase hex digest"
                  )
          if actual != expected:
              print(f"APK signer fingerprint: {actual}", file=sys.stderr)
              print(f"Keystore alias fingerprint: {expected}", file=sys.stderr)
              raise SystemExit(
                  "APK signer certificate does not match the configured keystore alias."
              )
          PY
          "$zipalign" -c -v 4 "$apk_path"

          asset_directory="${RUNNER_TEMP}/production-public-assets"
          private_directory="${RUNNER_TEMP}/production-private-aab"
          mkdir -p "$asset_directory" "$private_directory"
          apk_name="ALT-PARKING-Guard-${RELEASE_TAG}.apk"
          aab_name="ALT-PARKING-Guard-${RELEASE_TAG}.aab"
          cp "$apk_path" "${asset_directory}/${apk_name}"
          cp "$aab_path" "${private_directory}/${aab_name}"
          (
            cd "$asset_directory"
            sha256sum "$apk_name" > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )
          (
            cd "$private_directory"
            sha256sum "$aab_name" > AAB-SHA256SUMS.txt
            sha256sum --check AAB-SHA256SUMS.txt
          )
          apk_sha256="$(
            sha256sum "${asset_directory}/${apk_name}" |
              awk '{print $1}'
          )"
          built_at="$(git -C source show -s --format=%cI "$SOURCE_SHA")"
          python source/tool/release_metadata.py manifest \
            --tag "$RELEASE_TAG" \
            --pubspec source/pubspec.yaml \
            --package-id "$package_id" \
            --source-sha "$SOURCE_SHA" \
            --apk-sha256 "$apk_sha256" \
            --built-at "$built_at" \
            --output "${asset_directory}/release-manifest.json"
          expected_asset_names="$(
            printf '%s\n' \
              "$apk_name" \
              SHA256SUMS.txt \
              release-manifest.json |
              sort
          )"
          actual_asset_names="$(
            find "$asset_directory" -mindepth 1 -maxdepth 1 -type f \
              -printf '%f\n' |
              sort
          )"
          test "$actual_asset_names" = "$expected_asset_names"
          printf 'signer_sha256=%s\n' "$actual_certificate" >> "$GITHUB_OUTPUT"

      - name: Record disabled RuStore submission
        if: ${{ vars.RUSTORE_DELIVERY_ENABLED == 'false' || inputs.mode == 'build-only' }}
        shell: bash
        env:
          RUSTORE_DELIVERY_ENABLED: ${{ vars.RUSTORE_DELIVERY_ENABLED }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = {
              "status": "DISABLED",
              "publishable": False,
              "reason": "build-only" if os.environ["RELEASE_MODE"] == "build-only" else "delivery-disabled",
              "packageName": "ru.altparking.guard",
              "tag": os.environ["RELEASE_TAG"],
              "sourceSha": os.environ["SOURCE_SHA"],
              "publishType": "MANUAL",
              "partialValue": 100,
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "production-public-assets" / "rustore-submission.json"
          with path.open("xb") as output:
              output.write((json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii"))
          PY

      - name: Submit verified APK to RuStore moderation
        if: ${{ vars.RUSTORE_DELIVERY_ENABLED == 'true' && inputs.mode == 'publish' }}
        working-directory: controller
        shell: bash
        env:
          RUSTORE_SUBMIT_KEY_ID: ${{ secrets.RUSTORE_SUBMIT_KEY_ID }}
          RUSTORE_SUBMIT_PRIVATE_KEY_PKCS8_BASE64: ${{ secrets.RUSTORE_SUBMIT_PRIVATE_KEY_PKCS8_BASE64 }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SIGNER_SHA256: ${{ steps.verified.outputs.signer_sha256 }}
          TMPDIR: ${{ runner.temp }}/rustore-private
        run: |
          set -euo pipefail
          mkdir -m 700 "$TMPDIR"
          asset_directory="${RUNNER_TEMP}/production-public-assets"
          # The reviewed CLI creates only MANUAL/100 drafts and never publishes.
          # Its one-attempt journal survives only this runner. Fresh reruns stop
          # on pre-existing remote drafts/candidates and need operator reconciliation.
          python -m tool.rustore_release submit \
            --manifest "${asset_directory}/release-manifest.json" \
            --apk "${asset_directory}/ALT-PARKING-Guard-${RELEASE_TAG}.apk" \
            --tag "$RELEASE_TAG" \
            --source-sha "$SOURCE_SHA" \
            --signer-sha256 "$SIGNER_SHA256" \
            --output "${asset_directory}/rustore-submission.json"

      - name: Finalize verified public release bundle
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          asset_directory="${RUNNER_TEMP}/production-public-assets"
          apk_name="ALT-PARKING-Guard-${RELEASE_TAG}.apk"
          cd "$asset_directory"
          sha256sum --check SHA256SUMS.txt
          sha256sum "$apk_name" release-manifest.json rustore-submission.json > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          expected_asset_names="$(
            printf '%s\n' \
              "$apk_name" \
              SHA256SUMS.txt \
              release-manifest.json \
              rustore-submission.json |
              sort
          )"
          actual_asset_names="$(
            find "$asset_directory" -mindepth 1 -maxdepth 1 -printf '%f\n' |
              sort
          )"
          test "$actual_asset_names" = "$expected_asset_names"

      - name: Upload verified APK release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-public-assets-${{ inputs.tag }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/production-public-assets
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary production material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${GITHUB_WORKSPACE}/source/android/key.properties"
          rm -f "${GITHUB_WORKSPACE}/source/android/app/google-services.json"
          rm -f "${RUNNER_TEMP}/guard-production.jks"
          rm -f "${RUNNER_TEMP}/apk-signer-certificate.pem"
          rm -f "${RUNNER_TEMP}/expected-production-cert.der"
          rm -f "${RUNNER_TEMP}/work-database-code.txt"
          rm -rf "${RUNNER_TEMP}/production-private-aab"
          rm -rf "${RUNNER_TEMP}/production-public-assets"
          rm -rf "${RUNNER_TEMP}/rustore-private"
          rm -rf "${GITHUB_WORKSPACE}/source"
          rm -f "${RUNNER_TEMP}/private-release-tag.txt"
          rm -f "${RUNNER_TEMP}/private-mobile-ci-runs.json"
          rm -f "${RUNNER_TEMP}/latest-public-release.json"
          rm -f "${RUNNER_TEMP}/previous-release-manifest.json"

  publish:
    if: ${{ inputs.mode == 'publish' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out public release controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: controller

      - name: Download verified APK release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: production-public-assets-${{ inputs.tag }}-${{ inputs.source_sha }}
          path: release-assets

      - name: Publish verified public release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          apk_name="ALT-PARKING-Guard-${tag}.apk"
          cd release-assets
          sha256sum --check SHA256SUMS.txt

          page=1
          page_size=100
          release_pages=()
          while test "$page_size" -eq 100
          do
            page_path="$(
              printf '%s/public-releases-%06d.json' "$RUNNER_TEMP" "$page"
            )"
            release_status="$(
              curl --silent --show-error \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "X-GitHub-Api-Version: 2026-03-10" \
                --output "$page_path" \
                --write-out '%{http_code}' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100&page=${page}"
            )"
            test "$release_status" = "200" || {
              printf 'Public release lookup failed.\n' >&2
              exit 1
            }
            page_size="$(
              python -c \
                'import json,sys; value=json.load(open(sys.argv[1], encoding="utf-8")); isinstance(value, list) or sys.exit("release API page must be an array"); print(len(value))' \
                "$page_path"
            )"
            release_pages+=("$page_path")
            page=$((page + 1))
          done

          release_state="$(
            python "$GITHUB_WORKSPACE/controller/tool/release_state.py" select \
              --tag "$tag" \
              "${release_pages[@]}"
          )"
          case "$release_state" in
            absent)
              gh release create "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --title "ALT:PARKING Guard ${tag#v}" \
                --notes "Проверенная production-сборка ALT:PARKING Guard ${tag#v}." \
                --draft
              ;;
            draft)
              :
              ;;
            published)
              printf 'Existing release is published and immutable.\n' >&2
              exit 1
              ;;
            *)
              printf 'Unexpected public release state.\n' >&2
              exit 1
              ;;
          esac

          gh release upload "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "$apk_name" \
            SHA256SUMS.txt \
            release-manifest.json \
            rustore-submission.json

          verification_directory="${RUNNER_TEMP}/verified-public-release"
          mkdir -p "$verification_directory"
          gh release download "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$verification_directory" \
            --pattern "$apk_name" \
            --pattern SHA256SUMS.txt \
            --pattern release-manifest.json \
            --pattern rustore-submission.json
          (
            cd "$verification_directory"
            sha256sum --check SHA256SUMS.txt
          )
          cmp release-manifest.json \
            "${verification_directory}/release-manifest.json"
          cmp rustore-submission.json \
            "${verification_directory}/rustore-submission.json"
          cmp SHA256SUMS.txt "${verification_directory}/SHA256SUMS.txt"
          expected_asset_names="$(
            printf '%s\n' \
              "$apk_name" \
              SHA256SUMS.txt \
              release-manifest.json \
              rustore-submission.json |
              sort
          )"
          actual_asset_names="$(
            find "$verification_directory" \
              -mindepth 1 -maxdepth 1 -type f -printf '%f\n' |
              sort
          )"
          test "$actual_asset_names" = "$expected_asset_names"

          remote_assets="${RUNNER_TEMP}/public-release-assets.json"
          gh release view "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets > "$remote_assets"
          python - "$remote_assets" "$apk_name" <<'PY'
          import json
          import sys
          from pathlib import Path

          try:
              payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
              assets = payload["assets"]
              if not isinstance(assets, list):
                  raise ValueError()
              names = [asset["name"] for asset in assets]
              expected = [sys.argv[2], "SHA256SUMS.txt", "release-manifest.json", "rustore-submission.json"]
              if sorted(names) != sorted(expected):
                  raise ValueError()
          except (OSError, ValueError, TypeError, KeyError):
              raise SystemExit("Public release must contain exactly the four verified assets") from None
          PY

          gh release edit "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest

  rustore-publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'rustore-publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out public release controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: controller

      - name: Download exact public release bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          # Interrupted attempts require operator reconciliation and a new dispatch.
          test "$GITHUB_RUN_ATTEMPT" = "1"
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          apk_name="ALT-PARKING-Guard-${RELEASE_TAG}.apk"
          metadata_path="${RUNNER_TEMP}/rustore-publish-release.json"
          asset_directory="${RUNNER_TEMP}/rustore-publish-assets"
          mkdir -m 700 "$asset_directory"
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,assets > "$metadata_path"
          python - "$metadata_path" "$RELEASE_TAG" <<'PY'
          import json
          import sys
          from pathlib import Path

          try:
              payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
              if (payload["tagName"] != sys.argv[2] or payload["isDraft"] is not False
                      or payload["isPrerelease"] is not False or not isinstance(payload["assets"], list)):
                  raise ValueError()
              names = [asset["name"] for asset in payload["assets"]]
              expected = [f"ALT-PARKING-Guard-{sys.argv[2]}.apk", "release-manifest.json",
                          "rustore-submission.json", "SHA256SUMS.txt"]
              if sorted(names) != sorted(expected):
                  raise ValueError()
          except (OSError, ValueError, TypeError, KeyError):
              raise SystemExit("Exact published release with four unique assets required") from None
          PY
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$asset_directory" \
            --pattern "$apk_name" \
            --pattern release-manifest.json \
            --pattern rustore-submission.json \
            --pattern SHA256SUMS.txt

      - name: Validate immutable RuStore publication bundle
        id: publication
        working-directory: controller
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import os
          import re
          from datetime import datetime
          from pathlib import Path
          from tool.rustore_release import (
              ReleaseError, _bound_receipt, _load_object, _validate_confirmation,
              parse_receipt, request_from_manifest,
          )

          try:
              tag = os.environ["RELEASE_TAG"]
              source_sha = os.environ["SOURCE_SHA"]
              if (re.fullmatch(r"v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)", tag) is None
                      or re.fullmatch(r"[0-9a-f]{40}", source_sha) is None):
                  raise ValueError()
              assets = Path(os.environ["RUNNER_TEMP"]) / "rustore-publish-assets"
              apk_name = f"ALT-PARKING-Guard-{tag}.apk"
              checked_names = {apk_name, "release-manifest.json", "rustore-submission.json"}
              entries = list(assets.iterdir())
              if ({item.name for item in entries} != checked_names | {"SHA256SUMS.txt"}
                      or any(not item.is_file() or item.is_symlink() for item in entries)):
                  raise ValueError()
              checksums = {}
              for line in (assets / "SHA256SUMS.txt").read_text(encoding="ascii").splitlines():
                  match = re.fullmatch(r"([0-9a-f]{64})  (.+)", line)
                  if match is None or match[2] not in checked_names or match[2] in checksums:
                      raise ValueError()
                  checksums[match[2]] = match[1]
              if set(checksums) != checked_names:
                  raise ValueError()
              for name, expected in checksums.items():
                  with (assets / name).open("rb") as content:
                      if hashlib.file_digest(content, "sha256").hexdigest() != expected:
                          raise ValueError()
              manifest_path = assets / "release-manifest.json"
              manifest = _load_object(manifest_path.read_bytes())
              if set(manifest) != {"packageId", "versionName", "buildNumber", "sourceCommit", "apkSha256", "builtAt"}:
                  raise ValueError()
              if datetime.fromisoformat(manifest["builtAt"]).tzinfo is None:
                  raise ValueError()
              raw = (assets / "rustore-submission.json").read_bytes()
              receipt_sha256 = checksums["rustore-submission.json"]
              receipt = parse_receipt(raw, receipt_sha256)
              # The immutable receipt binds the certificate verified at submission
              # to these exact APK bytes; no signing material is needed here.
              request = request_from_manifest(manifest_path, assets / apk_name, tag, source_sha, receipt.signer_sha256)
              _bound_receipt(request, raw, receipt_sha256)
              _validate_confirmation(receipt, os.environ["CONFIRMATION"])
              with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
                  output.write(f"signer_sha256={receipt.signer_sha256}\nreceipt_sha256={receipt_sha256}\n")
          except (ReleaseError, OSError, ValueError, TypeError, KeyError):
              raise SystemExit("Immutable RuStore publication bundle validation failed") from None
          PY

      - name: Publish saved RuStore version
        working-directory: controller
        shell: bash
        env:
          RUSTORE_PUBLISH_KEY_ID: ${{ secrets.RUSTORE_PUBLISH_KEY_ID }}
          RUSTORE_PUBLISH_PRIVATE_KEY_PKCS8_BASE64: ${{ secrets.RUSTORE_PUBLISH_PRIVATE_KEY_PKCS8_BASE64 }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          SIGNER_SHA256: ${{ steps.publication.outputs.signer_sha256 }}
          RECEIPT_SHA256: ${{ steps.publication.outputs.receipt_sha256 }}
          TMPDIR: ${{ runner.temp }}/rustore-publish-private
        run: |
          set -euo pipefail
          mkdir -m 700 "$TMPDIR"
          asset_directory="${RUNNER_TEMP}/rustore-publish-assets"
          # CLI queries the saved ID, requires READY_FOR_PUBLICATION, sends one
          # publish, and succeeds only after that same ID is exactly ACTIVE.
          # Its attempt marker is local: reconcile any interrupted run before
          # a new manual dispatch. Never rewrite the immutable receipt.
          python -m tool.rustore_release publish \
            --manifest "${asset_directory}/release-manifest.json" \
            --apk "${asset_directory}/ALT-PARKING-Guard-${RELEASE_TAG}.apk" \
            --tag "$RELEASE_TAG" \
            --source-sha "$SOURCE_SHA" \
            --signer-sha256 "$SIGNER_SHA256" \
            --receipt "${asset_directory}/rustore-submission.json" \
            --receipt-sha256 "$RECEIPT_SHA256" \
            --confirmation "$CONFIRMATION" > "${RUNNER_TEMP}/rustore-publish-status.json"

      - name: Report confirmed RuStore publication
        shell: bash
        run: |
          set -euo pipefail
          cat "${RUNNER_TEMP}/rustore-publish-status.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove manual publication material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Includes rustore-submission.json.publish-attempt.json.
          rm -rf "${RUNNER_TEMP}/rustore-publish-assets"
          rm -rf "${RUNNER_TEMP}/rustore-publish-private"
          rm -f "${RUNNER_TEMP}/rustore-publish-release.json"
          rm -f "${RUNNER_TEMP}/rustore-publish-status.json"
